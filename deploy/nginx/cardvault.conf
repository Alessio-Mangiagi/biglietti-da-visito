# CardVault — app server (nginx serves the PWA and proxies /api on the SAME origin).
# Same origin = no CORS, and the refresh cookie is first-party for Safari/iOS (ITP).
# Replace cardvault.example.it, then: certbot --nginx -d cardvault.example.it

limit_req_zone $binary_remote_addr zone=cv_auth:10m rate=10r/m;

upstream cardvault_api {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name cardvault.example.it;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cardvault.example.it;

    ssl_certificate     /etc/letsencrypt/live/cardvault.example.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cardvault.example.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    root /var/www/cardvault;
    index index.html;
    client_max_body_size 6m; # card photos ≤ 2 MB, vCard imports ≤ 5 MB
    server_tokens off;

    # ---- security headers: nginx drops server-level add_header in any location that
    # sets its own, so the snippet is included everywhere
    include /etc/nginx/snippets/cardvault-security.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json text/vcard;

    # ---- API
    location /api/auth/ {
        limit_req zone=cv_auth burst=20 nodelay;
        proxy_pass http://cardvault_api;
        include /etc/nginx/snippets/cardvault-proxy.conf;
    }
    location /api/ {
        proxy_pass http://cardvault_api;
        include /etc/nginx/snippets/cardvault-proxy.conf;
    }

    # ---- PWA
    # hashed bundles: cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/cardvault-security.conf;
        try_files $uri =404;
    }
    # OCR engine and models: large, versioned with the app, cached a week
    location /ocr/ {
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/cardvault-security.conf;
        types { application/javascript js; application/gzip gz; }
        try_files $uri =404;
    }
    # service worker and its manifest must always be revalidated
    location ~ ^/(sw\.js|workbox-.*\.js|manifest\.webmanifest|index\.html)$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/cardvault-security.conf;
        try_files $uri =404;
    }
    # client-side routes (/cerca, /contatti/…) fall back to the app shell
    location / {
        try_files $uri /index.html;
    }
}
